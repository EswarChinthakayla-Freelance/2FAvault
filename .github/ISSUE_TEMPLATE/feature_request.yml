name: 💡 Feature Request
description: Propose an idea or feature request for 2FA Vault
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a new idea or improvement for 2FA Vault!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or features you have evaluated.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, mockup screenshots, or diagrams about the feature request here.
